name: Europrint ERP — CI/CD Pipeline

on:
  push:
    branches: [main, develop, "chore/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  checks: write

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  typecheck:
    name: TypeScript Tekshiruv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      - name: lib/db build (kerak: @workspace/db CJS importi uchun)
        run: pnpm --filter @workspace/db run build

      - name: nestjs-api typecheck
        run: pnpm --filter @europrint/api exec tsc --noEmit

      - name: erp-dashboard typecheck
        run: pnpm --filter @workspace/erp-dashboard run typecheck

  unit-tests:
    name: Vitest Unit Testlar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      - name: lib/db build (kerak: @workspace/db CJS importi uchun)
        run: pnpm --filter @workspace/db run build

      - name: nestjs-api testlarni ishga tushirish
        run: pnpm --filter @europrint/api run test
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: erp-dashboard testlarni ishga tushirish (coverage bilan)
        run: pnpm --filter @workspace/erp-dashboard run test:coverage
        env:
          NODE_ENV: test

      - name: Test natijalarini GitHub Summary ga qo'shish
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Vitest Test Natijalari
          path: |
            artifacts/erp-dashboard/test-results/vitest-junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Test results va coverage artifact saqlash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: |
            artifacts/erp-dashboard/test-results/
            artifacts/erp-dashboard/coverage/
          retention-days: 30

  lint:
    name: ESLint Tekshiruv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @europrint/api exec eslint src/ --ext .ts --max-warnings 0

  security-audit:
    name: Xavfsizlik Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=high

  build:
    name: Build Tekshiruv
    runs-on: ubuntu-latest
    needs: [typecheck, unit-tests, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      - name: nestjs-api build
        run: pnpm --filter @europrint/api run build
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: erp-dashboard build
        run: pnpm --filter @workspace/erp-dashboard run build

      - name: Build artifacts saqlash — nestjs-api
        uses: actions/upload-artifact@v4
        with:
          name: nestjs-api-dist-${{ github.run_number }}
          path: apps/api/dist/
          retention-days: 30

      - name: Build artifacts saqlash — erp-dashboard
        uses: actions/upload-artifact@v4
        with:
          name: erp-dashboard-dist-${{ github.run_number }}
          path: artifacts/erp-dashboard/dist/
          retention-days: 30
