name: Europrint — Kod Sifati

on:
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  quality-gate:
    name: Sifat Darvozasi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Test ishga tushirish va coverage
        run: pnpm --filter @europrint/api run test
        env:
          NODE_ENV: test
        continue-on-error: false

      - name: Test natijalarini tekshirish
        run: |
          echo "Barcha testlar muvaffaqiyatli o'tdi"

      - name: Semgrep xavfsizlik tekshiruvi
        uses: returntocorp/semgrep-action@v1
        with:
          config: .config/replit/.semgrep/semgrep_rules.json
