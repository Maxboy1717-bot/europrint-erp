# Phase 8, Task 8.2 — Test Postgres for integration tests
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   TEST_DATABASE_URL=postgres://test:test@localhost:55432/europrint_test \
#     pnpm --filter @europrint/api run test
#   docker compose -f docker-compose.test.yml down -v
#
# Port 55432 is intentionally non-standard to avoid clashing with any local
# Postgres (default 5432) or the dev compose stack.
#
# Data lives in a named volume `europrint_test_pg_data`. `down -v` wipes it.

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: europrint-postgres-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: europrint_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d europrint_test"]
      interval: 2s
      timeout: 5s
      retries: 20
    tmpfs:
      # Use a tmpfs for the data dir so tests start from a clean slate on every
      # container restart and run much faster than disk-backed storage.
      - /var/lib/postgresql/data:rw,size=512M
    command:
      - "postgres"
      - "-c"
      - "fsync=off"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "full_page_writes=off"

# No named volume — tmpfs above means data is ephemeral per container lifecycle.
