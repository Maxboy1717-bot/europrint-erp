/* ================================================================ */
function App() {
  const [page, setPage] = useState('dashboard');

  // POS Monitor is fullscreen — no sidebar
  if (page === 'pos') {
    return <PosMonitor onExit={() => setPage('dashboard')}/>;
  }

  const map = {
    'dashboard':  <DashboardPage/>,
    'analytics':  <AnalyticsPage/>,
    'calendar':   <CalendarEmpty/>,
    'orders':     <OrdersList/>,
    'tracking':   <OrderDetail/>,
    'warehouse':  <WarehousePage/>,
    'fleets':     <CreateOrderForm/>,
    'drivers':    <DriversList/>,
    'kanban':     <CrmKanban/>,
    'employee':   <EmployeeProfile/>,
    'invoices':   <InvoicesList/>,
    'messages':   <MessagesEmpty/>,
    'notif':      <NotifEmpty/>,
    'settings':   <SettingsPage/>,
  };

  return (
    <div className="app">
      <Sidebar active={page} onChange={(id) => setPage(id === 'pos' || map[id] ? id : 'dashboard')}/>
      <main className="main">{map[page] || <DashboardPage/>}</main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
