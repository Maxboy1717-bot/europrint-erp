<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>html,body{margin:0;padding:0;background:var(--bg1);color:var(--fg1);font-family:var(--font-sans);}
.wrap{padding:22px 26px;display:flex;gap:14px;align-items:center;}
.box{background:#fff;border:1px solid var(--line);width:72px;height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}
.box b{font-size:12px;font-weight:600;}
.box span{font-family:var(--font-mono);font-size:10px;color:var(--fg2);}</style></head>
<body><div class="wrap">
<div class="box" style="border-radius:4px"><b>r-xs</b><span>4px</span></div>
<div class="box" style="border-radius:6px"><b>r-sm</b><span>6px</span></div>
<div class="box" style="border-radius:8px;background:#FFE3C9;border-color:#FF902F"><b>r-md</b><span>8px</span></div>
<div class="box" style="border-radius:10px;background:#FFF8F0"><b>r-lg ★</b><span>10px</span></div>
<div class="box" style="border-radius:12px"><b>r-xl</b><span>12px</span></div>
<div class="box" style="border-radius:16px"><b>r-2xl</b><span>16px</span></div>
<div class="box" style="border-radius:9999px"><b>pill</b><span>full</span></div>
</div></body></html>
