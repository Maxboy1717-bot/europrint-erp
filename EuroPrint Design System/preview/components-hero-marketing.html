<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>html,body{margin:0;padding:0;background:var(--bg1);color:var(--fg1);font-family:var(--font-sans);}
.wrap{padding:14px 14px;}
.hero{background:#1a1a2e;border-radius:14px;padding:30px 32px;color:#fff;position:relative;overflow:hidden;}
.orb1{position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,144,47,.20);filter:blur(40px);}
.orb2{position:absolute;bottom:-50px;left:-30px;width:150px;height:150px;border-radius:50%;background:rgba(59,130,246,.10);filter:blur(40px);}
.eyebrow{display:inline-flex;align-items:center;gap:6px;background:rgba(255,144,47,.15);color:#FF902F;border:1px solid rgba(255,144,47,.25);font-size:11px;font-weight:600;padding:4px 12px;border-radius:9999px;margin-bottom:14px;}
.eyebrow::before{content:'';width:6px;height:6px;background:#FF902F;border-radius:50%;}
h1{font-weight:700;font-size:34px;line-height:1.15;margin:0 0 12px;letter-spacing:-.01em;}
h1 .br{color:#FF902F;}
.sub{color:rgba(255,255,255,.72);font-size:13.5px;line-height:1.55;max-width:380px;margin-bottom:18px;}
.cta-row{display:flex;gap:10px;}
.btn{padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:inherit;}
.btn-p{background:#FF902F;color:#fff;box-shadow:0 4px 14px rgba(255,144,47,.30);}
.btn-o{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);}</style></head>
<body><div class="wrap"><div class="hero">
<div class="orb1"></div><div class="orb2"></div>
<div style="position:relative">
<span class="eyebrow">Oʻzbekistonning №1 bosma kompaniyasi</span>
<h1>Professional<br/><span class="br">Bosma Yechimlar</span></h1>
<div class="sub">15 yillik tajriba, 400+ xodim, 50+ zamonaviy bosma mashina bilan har qanday murakkab buyurtmani oʻz vaqtida yetkazamiz.</div>
<div class="cta-row">
<button class="btn btn-p">Bepul narx olish →</button>
<button class="btn btn-o">Katalogni koʻrish</button>
</div>
</div>
</div></div></body></html>
