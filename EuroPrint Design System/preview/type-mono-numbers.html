<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>html,body{margin:0;padding:0;background:var(--bg1);color:var(--fg1);font-family:var(--font-sans);}
.wrap{padding:20px 26px;display:flex;gap:24px;align-items:center;}
.kpi{display:flex;flex-direction:column;align-items:flex-start;gap:4px;}
.kpi .v{font-size:32px;font-weight:700;line-height:1;letter-spacing:-.01em;}
.kpi .l{font-size:11px;color:var(--fg2);}
.divider{width:1px;background:var(--line);align-self:stretch;}
.mono{font-family:var(--font-mono);font-size:12px;color:var(--fg2);}
.code{background:#F4F3F0;border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-family:var(--font-mono);font-size:11.5px;}</style></head>
<body><div class="wrap">
<div class="kpi"><div class="v" style="color:#FF902F">15+</div><div class="l">Yil tajriba</div></div>
<div class="kpi"><div class="v">2,500+</div><div class="l">Mamnun mijozlar</div></div>
<div class="kpi"><div class="v">4.9<span style="font-size:18px;color:#FF902F"> ★</span></div><div class="l">Sifat reytingi</div></div>
<div class="divider"></div>
<div style="display:flex;flex-direction:column;gap:6px;">
<span class="code">SKU-2024-A1B2</span>
<span class="mono">+998 71 200 00 00</span>
<span class="mono">15,000 m² · 24/7</span>
</div>
</div></body></html>
