<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>html,body{margin:0;padding:0;background:var(--bg1);color:var(--fg1);font-family:var(--font-sans);}
.wrap{padding:20px 26px;display:flex;flex-direction:column;gap:9px;}
.row{display:flex;align-items:center;gap:14px;}
.bar{height:18px;background:#FF902F;border-radius:4px;}
.lbl{font-family:var(--font-mono);font-size:11px;color:var(--fg2);width:96px;}
.px{font-size:12px;color:var(--fg1);font-weight:500;width:42px;}</style></head>
<body><div class="wrap">
<div class="row"><span class="lbl">--space-1</span><span class="px">4</span><div class="bar" style="width:4px"></div></div>
<div class="row"><span class="lbl">--space-2</span><span class="px">8</span><div class="bar" style="width:8px"></div></div>
<div class="row"><span class="lbl">--space-3</span><span class="px">12</span><div class="bar" style="width:12px"></div></div>
<div class="row"><span class="lbl">--space-4</span><span class="px">14</span><div class="bar" style="width:14px"></div></div>
<div class="row"><span class="lbl">--space-5</span><span class="px">16</span><div class="bar" style="width:16px"></div></div>
<div class="row"><span class="lbl">--space-6</span><span class="px">20</span><div class="bar" style="width:20px"></div></div>
<div class="row"><span class="lbl">--space-7</span><span class="px">24</span><div class="bar" style="width:24px"></div></div>
<div class="row"><span class="lbl">--space-8</span><span class="px">32</span><div class="bar" style="width:32px"></div></div>
<div class="row"><span class="lbl">--space-10</span><span class="px">40</span><div class="bar" style="width:40px"></div></div>
<div class="row"><span class="lbl">--space-12</span><span class="px">56</span><div class="bar" style="width:56px"></div></div>
</div></body></html>
