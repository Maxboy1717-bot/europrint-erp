<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>html,body{margin:0;padding:0;background:var(--bg1);color:var(--fg1);font-family:var(--font-sans);}
.wrap{padding:18px 24px;display:flex;flex-direction:column;gap:10px;}
.toast{display:flex;align-items:flex-start;gap:11px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--sh-md);}
.tic{width:30px;height:30px;border-radius:8px;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;font-size:14px;}
.tbody{flex:1;display:flex;flex-direction:column;gap:2px;}
.ttl{font-size:13px;font-weight:600;}
.tdsc{font-size:12px;color:var(--fg2);}
.x{font-size:14px;color:var(--fg2);cursor:pointer;}
.alert{padding:10px 14px;border-radius:8px;font-size:12.5px;display:flex;align-items:center;gap:9px;border-left:3px solid;}
.alert b{font-weight:600;}</style></head>
<body><div class="wrap">
<div class="toast"><div class="tic" style="background:#2E8A5A">✓</div><div class="tbody"><div class="ttl">Muvaffaqiyatli saqlandi</div><div class="tdsc">Xodim maʼlumotlari yangilandi.</div></div><span class="x">×</span></div>
<div class="toast"><div class="tic" style="background:#C0432F">!</div><div class="tbody"><div class="ttl">Xatolik yuz berdi</div><div class="tdsc">Faylni yuklab boʻlmadi. Qayta urinib koʻring.</div></div><span class="x">×</span></div>
<div class="alert" style="background:rgba(255,144,47,.08);border-color:#FF902F;color:#7A3F11;"><b>Eslatma:</b> Ushbu hisobot 1 soatda yangilanadi.</div>
</div></body></html>
