<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>html,body{margin:0;padding:0;background:var(--bg1);color:var(--fg1);font-family:var(--font-sans);}
.wrap{padding:18px 22px;}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.sw{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--bg2);}
.chip{height:60px;display:flex;align-items:flex-end;padding:7px 9px;color:#fff;font-family:var(--font-mono);font-size:10px;font-weight:500;}
.icn{height:42px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:#fff;font-weight:600;}
.meta{padding:7px 9px;display:flex;flex-direction:column;gap:1px;}
.meta b{font-size:11.5px;font-weight:600;}
.meta span{font-size:10px;color:var(--fg2);font-family:var(--font-mono);}</style></head>
<body><div class="wrap"><div class="row">
<div class="sw"><div class="chip" style="background:#3563AC">#3563AC</div><div class="icn" style="background:#EAF0FA;color:#3563AC">SD</div><div class="meta"><b>Sales</b><span>--mod-sd</span></div></div>
<div class="sw"><div class="chip" style="background:#2E8A5A">#2E8A5A</div><div class="icn" style="background:#E6F4EC;color:#2E8A5A">PP</div><div class="meta"><b>Production</b><span>--mod-pp</span></div></div>
<div class="sw"><div class="chip" style="background:#7A4FB1">#7A4FB1</div><div class="icn" style="background:#F1EBF7;color:#7A4FB1">HR</div><div class="meta"><b>People</b><span>--mod-hr</span></div></div>
<div class="sw"><div class="chip" style="background:#B5891C">#B5891C</div><div class="icn" style="background:#F8F1DD;color:#B5891C">WMS</div><div class="meta"><b>Warehouse</b><span>--mod-warehouse</span></div></div>
<div class="sw"><div class="chip" style="background:#1A8FAF">#1A8FAF</div><div class="icn" style="background:#DDEFF4;color:#1A8FAF">FI</div><div class="meta"><b>Finance</b><span>--mod-fi</span></div></div>
</div></div></body></html>
