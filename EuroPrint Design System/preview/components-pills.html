<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>html,body{margin:0;padding:0;background:var(--bg1);color:var(--fg1);font-family:var(--font-sans);}
.wrap{padding:18px 24px;display:flex;flex-direction:column;gap:12px;}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:4px 10px;border-radius:12px;}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.tag{font-size:11px;font-weight:500;padding:4px 10px;border-radius:6px;color:#fff;}
.lbl{font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--fg2);}</style></head>
<body><div class="wrap">
<div class="row"><span class="lbl" style="width:80px">Status pill</span>
<span class="pill" style="background:rgba(0,192,135,.12);color:#2E8A5A">Faol</span>
<span class="pill" style="background:rgba(255,193,7,.18);color:#b58a00">Kutilmoqda</span>
<span class="pill" style="background:rgba(255,82,82,.12);color:#C0432F">Bekor qilingan</span>
<span class="pill" style="background:rgba(40,201,232,.15);color:#0aa2c0">Maʼlumot</span>
<span class="pill" style="background:rgba(255,144,47,.15);color:#FF902F">Yangi</span>
<span class="pill" style="background:rgba(132,94,230,.15);color:#7A4FB1">Yopiq</span>
</div>
<div class="row"><span class="lbl" style="width:80px">Job tag</span>
<span class="tag" style="background:#1f2937">Admin</span>
<span class="tag" style="background:#3B82F6">Sotuv</span>
<span class="tag" style="background:#C45C7A">HR</span>
<span class="tag" style="background:#7A4FB1">Marketing</span>
<span class="tag" style="background:#2E8A5A">Ishlab chiqarish</span>
<span class="tag" style="background:#FF902F">Buyurtma</span>
</div>
</div></body></html>
