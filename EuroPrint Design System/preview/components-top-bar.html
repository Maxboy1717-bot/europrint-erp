<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>html,body{margin:0;padding:0;background:var(--bg1);color:var(--fg1);font-family:var(--font-sans);}
.wrap{padding:14px 14px;}
.bar{background:#fff;border:1px solid var(--line);border-bottom-width:1px;border-radius:10px;height:60px;display:flex;align-items:center;padding:0 16px;gap:14px;}
.brand{display:flex;align-items:center;gap:10px;padding-right:14px;border-right:1px solid var(--line);}
.brand-mark{width:30px;height:30px;background:#FF902F;border-radius:7px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
.brand-name{font-weight:700;font-size:15px;}
.brand-name span{color:#FF902F;}
.search{flex:1;max-width:320px;display:flex;align-items:center;gap:8px;background:#FAF9F6;border:1px solid var(--line);border-radius:8px;padding:0 12px;height:36px;font-size:12.5px;color:var(--fg2);}
.right{margin-left:auto;display:flex;align-items:center;gap:6px;}
.ibtn{width:34px;height:34px;border-radius:50%;background:#FAF9F6;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--fg2);position:relative;cursor:pointer;}
.ibtn:hover{background:rgba(255,144,47,.10);color:#FF902F;}
.dot{position:absolute;top:6px;right:6px;width:7px;height:7px;background:#C0432F;border-radius:50%;border:2px solid #fff;}
.av{width:32px;height:32px;border-radius:50%;background:#FF902F;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;}</style></head>
<body><div class="wrap"><div class="bar">
<div class="brand"><div class="brand-mark">EP</div><div class="brand-name">Euro<span>Print</span></div></div>
<div class="search">⌕ &nbsp; Buyurtma, mijoz, mahsulot qidirish…</div>
<div class="right">
<div class="ibtn">✉<span class="dot"></span></div>
<div class="ibtn">🔔<span class="dot"></span></div>
<div class="ibtn">⊕</div>
<div class="av">AU</div>
</div>
</div></div></body></html>
