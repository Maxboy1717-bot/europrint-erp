<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>html,body{margin:0;padding:0;background:var(--bg1);color:var(--fg1);font-family:var(--font-sans);}
.wrap{padding:20px 24px;display:flex;flex-direction:column;gap:14px;}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;line-height:1;transition:all .15s;}
.btn-primary{background:#FF902F;color:#fff;}
.btn-primary:hover{background:#F07F1B;}
.btn-secondary{background:#F6F5F2;color:var(--fg1);border-color:var(--line);}
.btn-outline{background:transparent;color:#FF902F;border-color:#FF902F;}
.btn-ghost{background:transparent;color:var(--fg1);}
.btn-ghost:hover{background:var(--bg3);}
.btn-danger{background:#C0432F;color:#fff;}
.btn-dark{background:#15171A;color:#fff;}
.btn-sm{padding:5px 11px;font-size:12px;}
.btn-lg{padding:11px 20px;font-size:14px;}
.lbl{font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--fg2);}</style></head>
<body><div class="wrap">
<div class="row"><span class="lbl" style="width:64px">Primary</span>
<button class="btn btn-primary">Saqlash</button>
<button class="btn btn-primary"><span>+</span> Yangi qoʻshish</button>
<button class="btn btn-primary btn-sm">Yuborish</button>
</div>
<div class="row"><span class="lbl" style="width:64px">Variants</span>
<button class="btn btn-secondary">Bekor qilish</button>
<button class="btn btn-outline">Eksport</button>
<button class="btn btn-ghost">Yopish</button>
<button class="btn btn-dark">Koʻproq bilish</button>
<button class="btn btn-danger">Oʻchirish</button>
</div>
</div></body></html>
