<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>html,body{margin:0;padding:0;background:var(--bg1);color:var(--fg1);font-family:var(--font-sans);}
.wrap{padding:18px 22px;}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.sw{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--bg2);}
.chip{height:78px;display:flex;align-items:flex-end;padding:8px 10px;font-family:var(--font-mono);font-size:10.5px;font-weight:500;}
.meta{padding:8px 10px;display:flex;flex-direction:column;gap:2px;}
.meta b{font-size:12px;font-weight:600;}
.meta span{font-size:10.5px;color:var(--fg2);font-family:var(--font-mono);}</style></head>
<body><div class="wrap"><div class="row">
<div class="sw"><div class="chip" style="background:#15171A;color:#fff">#15171A</div><div class="meta"><b>Text / fg1</b><span>--ep-text</span></div></div>
<div class="sw"><div class="chip" style="background:#6B6E72;color:#fff">#6B6E72</div><div class="meta"><b>Muted / fg2</b><span>--ep-muted</span></div></div>
<div class="sw"><div class="chip" style="background:#9A9CA0;color:#fff">#9A9CA0</div><div class="meta"><b>Subtle / fg3</b><span>--ep-subtle</span></div></div>
<div class="sw"><div class="chip" style="background:#FAFAF9;color:#15171A;border-bottom:1px solid #EBEAE6">#FAFAF9</div><div class="meta"><b>Page bg</b><span>--ep-bg</span></div></div>
<div class="sw"><div class="chip" style="background:#FFFFFF;color:#15171A;border-bottom:1px solid #EBEAE6">#FFFFFF</div><div class="meta"><b>Surface</b><span>--ep-surface</span></div></div>
<div class="sw"><div class="chip" style="background:#EBEAE6;color:#15171A">#EBEAE6</div><div class="meta"><b>Border</b><span>--ep-border</span></div></div>
<div class="sw"><div class="chip" style="background:#1a1a2e;color:#fff">#1a1a2e</div><div class="meta"><b>Navy</b><span>--ep-navy (marketing)</span></div></div>
<div class="sw"><div class="chip" style="background:#f8f9fc;color:#15171A;border-bottom:1px solid #EBEAE6">#f8f9fc</div><div class="meta"><b>Bg Cool</b><span>--ep-bg-cool (site)</span></div></div>
</div></div></body></html>
