<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>html,body{margin:0;padding:0;background:var(--bg1);color:var(--fg1);font-family:var(--font-sans);}
.wrap{padding:18px 24px;display:flex;flex-direction:column;gap:14px;}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--fg2);}
.tabs-underline{display:flex;gap:0;border-bottom:1px solid var(--line);}
.tabs-underline button{background:none;border:none;padding:10px 16px;font-size:13px;color:var(--fg2);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;font-family:inherit;}
.tabs-underline button.act{color:#FF902F;border-bottom-color:#FF902F;font-weight:600;}
.tabs-pill{display:inline-flex;background:#F6F5F2;border-radius:8px;padding:3px;}
.tabs-pill button{background:transparent;border:none;padding:6px 16px;border-radius:6px;font-size:12px;font-weight:500;color:var(--fg2);cursor:pointer;font-family:inherit;}
.tabs-pill button.act{background:#FF902F;color:#fff;}</style></head>
<body><div class="wrap">
<div><div class="eyebrow" style="margin-bottom:8px">Underline tabs (page-level)</div><div class="tabs-underline"><button class="act">Umumiy</button><button>Davomat</button><button>Maosh</button><button>Hujjatlar</button></div></div>
<div><div class="eyebrow" style="margin-bottom:8px">Pill tabs (filter / segment)</div><div class="tabs-pill"><button class="act">Kun</button><button>Hafta</button><button>Oy</button><button>Yil</button></div></div>
</div></body></html>
