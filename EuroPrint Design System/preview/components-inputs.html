<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>html,body{margin:0;padding:0;background:var(--bg1);color:var(--fg1);font-family:var(--font-sans);}
.wrap{padding:18px 24px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.field{display:flex;flex-direction:column;gap:5px;}
label{font-size:12px;font-weight:500;color:var(--fg1);}
input,select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--fg1);font-size:13px;outline:none;font-family:inherit;box-sizing:border-box;}
input:focus,select:focus{border-color:#FF902F;box-shadow:0 0 0 2px rgba(255,144,47,.15);}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:0 12px;height:38px;}
.search input{border:none;padding:0;box-shadow:none;}
.search-ic{color:var(--fg2);font-size:14px;font-weight:600;}
.help{font-size:11px;color:var(--fg2);}</style></head>
<body><div class="wrap">
<div class="field"><label>Xodim ismi</label><input type="text" placeholder="Masalan: Alisher Karimov"/></div>
<div class="field"><label>Boʻlim</label><select><option>Ishlab chiqarish</option></select></div>
<div class="field"><label>Telefon</label><input type="text" value="+998 71 200 00 00" style="border-color:#FF902F;box-shadow:0 0 0 2px rgba(255,144,47,.15);"/></div>
<div class="field"><label>Qidirish</label><div class="search"><span class="search-ic">⌕</span><input placeholder="Buyurtma, mijoz, mahsulot…"/></div></div>
</div></body></html>
