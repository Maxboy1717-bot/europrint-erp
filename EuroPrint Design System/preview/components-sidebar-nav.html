<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>html,body{margin:0;padding:0;background:var(--bg1);color:var(--fg1);font-family:var(--font-sans);}
.wrap{padding:14px 20px;display:flex;gap:14px;}
.side{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 0;width:240px;}
.sec{font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--fg2);padding:12px 18px 5px;}
.ni{display:flex;align-items:center;gap:10px;padding:8px 18px;font-size:13px;color:var(--fg1);font-weight:500;cursor:pointer;border-left:3px solid transparent;}
.ni .ic{width:18px;text-align:center;color:var(--fg2);font-size:13px;}
.ni .bdg{margin-left:auto;font-size:10px;font-weight:600;background:#FF902F;color:#fff;border-radius:10px;padding:1px 7px;}
.ni:hover{background:rgba(255,144,47,.04);color:#FF902F;}
.ni:hover .ic{color:#FF902F;}
.ni.act{border-left-color:#FF902F;background:rgba(255,144,47,.06);color:#FF902F;font-weight:600;}
.ni.act .ic{color:#FF902F;}
.note{align-self:flex-end;font-size:11px;color:var(--fg2);padding-bottom:8px;}</style></head>
<body><div class="wrap"><div class="side">
<div class="sec">Asosiy</div>
<div class="ni act"><span class="ic">▦</span>Bosh sahifa</div>
<div class="ni"><span class="ic">◷</span>HR Dashboard</div>
<div class="ni"><span class="ic">↗</span>CFO Dashboard</div>
<div class="sec">Xodimlar</div>
<div class="ni"><span class="ic">⛁</span>Xodimlar</div>
<div class="ni"><span class="ic">▤</span>Boʻlimlar</div>
<div class="ni"><span class="ic">◴</span>Davomat<span class="bdg">12</span></div>
</div>
<div class="note">3px left-border + 6% primary tint = active.<br>Hover = 4% primary tint.<br>Section labels: 10px / 600 / uppercase.</div>
</div></body></html>
