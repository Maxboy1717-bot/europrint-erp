<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>html,body{margin:0;padding:0;background:var(--bg1);color:var(--fg1);font-family:var(--font-sans);}
.wrap{padding:14px 20px;}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{background:#F6F5F2;font-size:10.5px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.6px;padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);}
td{padding:11px 14px;font-size:13px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#FBFAF8;}
.av{width:28px;height:28px;border-radius:50%;background:#FF902F;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;margin-right:8px;vertical-align:middle;}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:3px 9px;border-radius:12px;}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}</style></head>
<body><div class="wrap"><div class="card"><table>
<thead><tr><th>Xodim</th><th>Boʻlim</th><th>Holat</th><th style="text-align:right">Maosh</th></tr></thead>
<tbody>
<tr><td><span class="av">A</span>Alisher Karimov</td><td>Ishlab chiqarish</td><td><span class="pill" style="background:rgba(0,192,135,.12);color:#2E8A5A">Faol</span></td><td style="text-align:right;font-family:var(--font-mono)">8 500 000</td></tr>
<tr><td><span class="av" style="background:#3563AC">D</span>Dilnoza Yusupova</td><td>HR</td><td><span class="pill" style="background:rgba(255,193,7,.18);color:#b58a00">Tatil</span></td><td style="text-align:right;font-family:var(--font-mono)">7 200 000</td></tr>
<tr><td><span class="av" style="background:#7A4FB1">B</span>Bekzod Rahimov</td><td>Sotuv</td><td><span class="pill" style="background:rgba(0,192,135,.12);color:#2E8A5A">Faol</span></td><td style="text-align:right;font-family:var(--font-mono)">9 100 000</td></tr>
</tbody>
</table></div></div></body></html>
