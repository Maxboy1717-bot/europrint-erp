<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>html,body{margin:0;padding:0;background:var(--bg1);color:var(--fg1);font-family:var(--font-sans);}
.wrap{padding:18px 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
.icn{width:42px;height:42px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;}
.lbl{font-size:11px;color:var(--fg2);margin-top:10px;}
.val{font-size:22px;font-weight:700;margin-top:2px;letter-spacing:-.01em;}
.lnk{font-size:11px;color:#FF902F;margin-top:6px;font-weight:500;}
.delta{font-size:11px;color:#2E8A5A;font-weight:500;margin-left:4px;}</style></head>
<body><div class="wrap">
<div class="kpi"><div class="icn" style="background:#FF902F">B</div><div class="lbl">Bugungi buyurtmalar</div><div class="val">142 <span class="delta">↑ 12%</span></div><div class="lnk">Hammasi →</div></div>
<div class="kpi"><div class="icn" style="background:#3563AC">$</div><div class="lbl">Oylik daromad</div><div class="val">₿ 2.4M</div><div class="lnk">Hisobotlar →</div></div>
<div class="kpi"><div class="icn" style="background:#2E8A5A">⚙</div><div class="lbl">Faol mashinalar</div><div class="val">48 / 50</div><div class="lnk">MES paneli →</div></div>
</div></body></html>
