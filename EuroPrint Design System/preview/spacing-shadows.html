<!doctype html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>html,body{margin:0;padding:0;background:var(--bg1);color:var(--fg1);font-family:var(--font-sans);}
.wrap{padding:30px 26px 38px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;}
.box{background:#fff;border-radius:10px;width:88px;height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1px solid rgba(0,0,0,.02);}
.box b{font-size:11.5px;font-weight:600;}
.box span{font-family:var(--font-mono);font-size:9.5px;color:var(--fg2);}</style></head>
<body><div class="wrap">
<div class="box" style="box-shadow:var(--sh-2xs)"><b>2xs</b><span>1px / 4%</span></div>
<div class="box" style="box-shadow:var(--sh-xs)"><b>xs</b><span>3px / 6%</span></div>
<div class="box" style="box-shadow:var(--sh-sm)"><b>sm</b><span>6px / 6%</span></div>
<div class="box" style="box-shadow:var(--sh-md)"><b>md</b><span>12px / 7%</span></div>
<div class="box" style="box-shadow:var(--sh-lg)"><b>lg</b><span>20px / 8%</span></div>
<div class="box" style="box-shadow:0 4px 14px rgba(255,144,47,.30);border-color:#FF902F"><b style="color:#FF902F">primary</b><span>tinted</span></div>
</div></body></html>
