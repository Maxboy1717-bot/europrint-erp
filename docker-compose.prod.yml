# EuroPrint ERP — Production Compose
version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-europrint}
      POSTGRES_USER: ${POSTGRES_USER:-europrint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-europrint}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-europrint}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-europrint}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      SENTRY_DSN: ${SENTRY_DSN:-}
      AI_INTEGRATIONS_GEMINI_API_KEY: ${AI_INTEGRATIONS_GEMINI_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    ports:
      - "127.0.0.1:4000:4000"

  nginx:
    image: nginx:1.27-alpine
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro

  # Daily DB backup
  backup:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      - postgres
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          DATE=$$(date +%Y-%m-%d-%H%M)
          pg_dump -h postgres -U ${POSTGRES_USER:-europrint} -F c -d ${POSTGRES_DB:-europrint} \
            -f /backups/europrint-$$DATE.dump
          echo "Backup created: europrint-$$DATE.dump"
          find /backups -name "europrint-*.dump" -mtime +30 -delete
          sleep 86400
        done

volumes:
  pgdata:
