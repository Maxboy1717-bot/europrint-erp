# EuroPrint ERP — Production Docker Compose
#
# Usage:
#   cp .env.example .env  # fill secrets
#   docker compose up -d
#   docker compose logs -f api
#   docker compose exec api pnpm --filter @europrint/lib-db run migrate
#   docker compose exec api pnpm --filter @europrint/api run seed
#
# For SSL termination, put Nginx (see nginx.conf) in front of the api service.

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-europrint}
      POSTGRES_USER: ${POSTGRES_USER:-europrint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/var/backups/europrint
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-europrint}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--maxmemory', '512mb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-europrint}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-europrint}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required (min 32 chars)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://erp.europrint.uz}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://erp.europrint.uz}
      BACKUP_DIR: /var/backups/europrint
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      # Optional integrations (empty = feature disabled)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GCS_BUCKET: ${GCS_BUCKET:-}
    ports:
      - '127.0.0.1:3000:3000'   # bind to localhost; expose via Nginx
    volumes:
      - ./backups:/var/backups/europrint
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - internal

  # Optional: Nginx reverse proxy with SSL.
  # Uncomment + place nginx.conf and certs in ./nginx/
  # nginx:
  #   image: nginx:1.27-alpine
  #   restart: unless-stopped
  #   depends_on: [api]
  #   ports:
  #     - '80:80'
  #     - '443:443'
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/certs:/etc/nginx/certs:ro
  #     - ./artifacts/erp-dashboard/dist:/usr/share/nginx/html:ro
  #   networks:
  #     - internal

volumes:
  postgres-data:
  redis-data:

networks:
  internal:
    driver: bridge
