kind = "web"
previewPath = "/erp-dashboard/"
title = "EuroPrint ERP Dashboard"
version = "1.0.0"
id = "artifacts/erp-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/erp-dashboard/" ]
localPort = 20806

[services.development]
run = "pnpm --filter @workspace/erp-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/erp-dashboard", "run", "build" ]
publicDir = "artifacts/erp-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20806"
BASE_PATH = "/erp-dashboard/"
