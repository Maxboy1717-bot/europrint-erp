kind = "web"
previewPath = "/"
title = "EuroPrint — Ommaviy Sayt"
version = "1.0.0"
id = "artifacts/europrint-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19721

[services.development]
run = "pnpm --filter @workspace/europrint-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/europrint-site", "run", "build" ]
publicDir = "artifacts/europrint-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19721"
BASE_PATH = "/"
