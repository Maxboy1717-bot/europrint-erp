# ===========================================================================
# EuroPrint ERP — Nginx reverse proxy + SSL termination
# Tested with nginx 1.27 (Alpine) — place at /etc/nginx/nginx.conf or
# wire into docker-compose.yml `nginx` service.
#
# Replace these before use:
#   - server_name (erp.europrint.uz, api.europrint.uz)
#   - ssl_certificate / ssl_certificate_key paths
#   - upstream `api_backend` if not Docker-resolved
# ===========================================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 4096;
  multi_accept on;
  use epoll;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ── Logging ─────────────────────────────────────────────────────────────
  log_format combined_ext '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'rt=$request_time uct="$upstream_connect_time" '
                          'uht="$upstream_header_time" urt="$upstream_response_time"';
  access_log /var/log/nginx/access.log combined_ext;
  error_log /var/log/nginx/error.log warn;

  # ── Performance ─────────────────────────────────────────────────────────
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 1000;
  reset_timedout_connection on;
  client_body_timeout 30s;
  client_header_timeout 10s;
  send_timeout 30s;

  # ── Body / upload limits ────────────────────────────────────────────────
  client_max_body_size 50M;     # max file upload (match @fastify/multipart)
  client_body_buffer_size 128k;

  # ── Compression ─────────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    application/javascript application/json application/xml
    application/wasm application/manifest+json
    font/woff font/woff2
    image/svg+xml
    text/css text/javascript text/plain text/xml;

  # ── Edge rate limiting ──────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=100r/m;
  limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
  limit_req_status 429;

  # ── Security headers (defense-in-depth; app sets its own too) ──────────
  map $sent_http_content_type $csp_header {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss:; font-src 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests";
  }

  # ── Upstream API ────────────────────────────────────────────────────────
  upstream api_backend {
    server api:3000 max_fails=3 fail_timeout=30s;
    # Add more servers here for horizontal scaling.
    # server api-2:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  # ── HTTP → HTTPS redirect ───────────────────────────────────────────────
  server {
    listen 80;
    listen [::]:80;
    server_name erp.europrint.uz api.europrint.uz;

    # ACME challenge passthrough (Certbot)
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS: API server ───────────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.europrint.uz;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $csp_header always;

    # Health check (no rate limit)
    location = /api/health {
      proxy_pass http://api_backend;
      access_log off;
    }

    # Auth endpoints — tighter rate limit
    location /api/auth/ {
      limit_req zone=api_auth burst=5 nodelay;
      proxy_pass http://api_backend;
      include /etc/nginx/proxy_params.conf;
    }

    # WebSocket (Socket.io) — must include Upgrade headers
    location /socket.io/ {
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400;
      proxy_send_timeout 86400;
    }

    # General API
    location / {
      limit_req zone=api_general burst=20 nodelay;
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
      proxy_buffering on;
      proxy_buffers 8 16k;
      proxy_busy_buffers_size 32k;
    }
  }

  # ── HTTPS: Frontend (static SPA + reverse-proxy /api to API server) ─────
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.europrint.uz;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets — long cache
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # SPA fallback — every unknown path returns index.html
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }

    # Proxy /api/* to the API server (same-origin requests from SPA)
    location /api/ {
      limit_req zone=api_general burst=20 nodelay;
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket via same origin
    location /socket.io/ {
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 86400;
    }
  }
}
